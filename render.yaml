services:
  - type: web
    name: ascos-backend
    runtime: node
    region: "frankfurt"
    plan: starter # ou free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
